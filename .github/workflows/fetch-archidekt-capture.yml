# One-shot capture helper (2026-08-20, R2-P18). The dev sandbox's egress
# proxy blocks archidekt.com on every lane, and the round-2 fix for the
# Archidekt adapter needs the REAL API response shape for a deck --
# synthesizing it is the exact failure mode the fixture would exist to
# catch. CI runners have open egress, so this workflow_dispatch job
# fetches one deck's JSON and commits it to the calling branch under
# tests/fixtures/_captures/ as raw material. It is NOT the fixture:
# the checked-in fixture is hand-trimmed from this capture with
# provenance noted, and the capture file is deleted once consumed.
name: fetch-archidekt-capture

# Trigger: push-based rather than workflow_dispatch, because GitHub only
# registers dispatchable workflows from the DEFAULT branch, and this
# helper lives on a feature branch. Committing a request file both
# triggers the run and carries the deck id.
on:
  push:
    branches: ["claude/ollama-code-analysis-ak77i1"]
    paths: ["tests/fixtures/_captures/request.txt"]

permissions:
  contents: write

concurrency:
  group: archidekt-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Fetch deck JSON
        run: |
          DECK_ID="$(tr -cd '0-9' < tests/fixtures/_captures/request.txt)"
          if [ -z "$DECK_ID" ]; then echo "request.txt must contain a numeric deck id"; exit 1; fi
          echo "deck id: $DECK_ID"
          curl -sS --fail --max-time 60 \
            -H "Accept: application/json" \
            -H "User-Agent: commander-builder-fixture-capture/1.0" \
            "https://archidekt.com/api/decks/$DECK_ID/" \
            -o "tests/fixtures/_captures/archidekt_deck_$DECK_ID.json"
          python3 - <<'PY'
          import json, collections, glob
          path = glob.glob("tests/fixtures/_captures/archidekt_deck_*.json")[0]
          data = json.load(open(path))
          print("top-level keys:", sorted(data.keys()))
          cards = data.get("cards", [])
          layouts = collections.Counter(
              (c.get("card", {}).get("oracleCard", {}) or {}).get("layout")
              for c in cards
          )
          print("card count:", len(cards), "layouts:", dict(layouts))
          PY
      - name: Commit capture to the calling branch
        run: |
          git config user.name "archidekt-capture[bot]"
          git config user.email "noreply@users.noreply.github.com"
          git add tests/fixtures/_captures/
          git commit -m "chore: capture Archidekt deck API response (raw material for the R2-P18 fixture; delete after trimming) [skip ci]"
          git push
