# One-shot capture helper (2026-08-20, R2-P18). The dev sandbox's egress
# proxy blocks archidekt.com on every lane, and the round-2 fix for the
# Archidekt adapter needs the REAL API response shape for a deck --
# synthesizing it is the exact failure mode the fixture would exist to
# catch. CI runners have open egress, so this workflow_dispatch job
# fetches one deck's JSON and commits it to the calling branch under
# tests/fixtures/_captures/ as raw material. It is NOT the fixture:
# the checked-in fixture is hand-trimmed from this capture with
# provenance noted, and the capture file is deleted once consumed.
name: fetch-archidekt-capture

# Trigger: push-based on the feature branch because GitHub only
# registers dispatchable workflows from the DEFAULT branch, and this
# helper was born on a feature branch. Committing a request file both
# triggers the run and carries the deck id.
# workflow_dispatch added 2026-09-16 (R4 B-15, the R3 F-17 ask): once
# this branch merges, the branch named below no longer exists and a
# request.txt push to master would trigger nothing. The dispatch
# trigger registers on master AT merge, so the lane survives the
# branch. The optional `request` input is written to request.txt so
# the fetch step below needs no second code path.
on:
  workflow_dispatch:
    inputs:
      request:
        description: >-
          Contents for tests/fixtures/_captures/request.txt (a deck id,
          `commander:<name>`, `mode: primer-batch` or `url: https://...`).
          Leave empty to use the committed request.txt.
        required: false
        default: ""
  push:
    branches: ["claude/ollama-code-analysis-ak77i1"]
    paths: ["tests/fixtures/_captures/request.txt"]

permissions:
  contents: write

concurrency:
  group: archidekt-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Materialise a dispatch request
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.request != '' }}
        run: |
          mkdir -p tests/fixtures/_captures
          printf '%s\n' "${{ github.event.inputs.request }}" > tests/fixtures/_captures/request.txt
      - name: Fetch deck JSON
        run: |
          # Deleting the request file (the consume step) also matches
          # this workflow's paths filter -- that push must be a clean
          # no-op, not a failure (learned 2026-08-20: the fixture
          # cleanup triggered a red X on the PR).
          if [ ! -f tests/fixtures/_captures/request.txt ]; then
            echo "request.txt absent (consumed) -- nothing to fetch"; exit 0
          fi
          # Three request forms (third reworked 2026-08-27 for FP-018.4
          # batch 2, owner-directed):
          #   <deck id>            -- fetch that deck
          #   commander:<name>     -- search decks by commander via the
          #                           documented v3 search endpoint and
          #                           fetch the most-viewed public hit
          #                           (exists so the R2-P18 MDFC gap
          #                           could close without a known id).
          #   mode: primer-batch   -- FP-018.4 corpus harvest: walk the
          #                           TOP-RANKED public commander decks
          #                           on BOTH Archidekt and Moxfield and
          #                           keep the first `per-site:` (default
          #                           25) whose description renders to
          #                           >= 200 chars, subject to:
          #                           - most-liked ordering where the API
          #                             has it (Moxfield). Archidekt's
          #                             API exposes NO like count
          #                             (archidekt_client.py pins this),
          #                             so views stay its proxy;
          #                           - exact-duplicate lists rejected
          #                             (fingerprint over sorted card
          #                             names, shared across sites);
          #                           - at most TWO decks per commander
          #                             across the whole batch -- a third
          #                             is skipped and the walk continues
          #                             down the ranking (owner call,
          #                             2026-08-27);
          #                           - card-link embeds count toward
          #                             primer length (batch-1 finding:
          #                             card mentions are non-string
          #                             Delta inserts).
          #                           Captures are trimmed IN-RUNNER
          #                           (description byte-verbatim, card
          #                           list reduced) so a 50-deck harvest
          #                           does not bake raw JSON megabytes
          #                           into history after the consume
          #                           step deletes them.
          # Number parsing: FIRST number, not all digits concatenated -- a
          # retry marker like '24864897 retry-1' must not become 248648971
          # (exactly what happened on attempt 2).
          # Fourth form (2026-09-09, audit open bug 1): `url: <https://...>`
          # captures an arbitrary page VERBATIM (bytes untouched) plus a
          # sidecar JSON with status/final URL/content-type. Exists because
          # the Game Changers scraper's parser broke against the current
          # WotC page and the sandbox cannot reach magic.wizards.com --
          # the fix must be pinned against the real page, never a
          # synthesized one. Same UA ladder as the deck fetch.
          # Fifth + sixth forms (2026-09-26, win-condition research):
          #   oracle-names: <path>  -- Scryfall's bulk oracle_cards file
          #                            (~150 MB, fetched in the runner
          #                            where egress is open) trimmed to
          #                            the names listed one-per-line in
          #                            <path> (front-face names match
          #                            "Front // Back" cards). Written as
          #                            a compact JSON so 3k cards of REAL
          #                            oracle text can be reasoned over
          #                            offline without inventing any.
          #   combos: <top_n>       -- runs the repo's own
          #                            combo_detection.refresh_combos
          #                            (Commander Spellbook, ordering
          #                            =-popularity) with the output
          #                            redirected into _captures/, so
          #                            the capture IS the production
          #                            code path's output, not a copy of
          #                            it. data/ is gitignored, which is
          #                            why the sandbox never has it.
          # Both may share one request.txt with each other and with
          # url: lines; the url block below runs last.
          # Seventh form (2026-09-28, forge-canary 5/5 red): `probe: <url>`
          # downloads a release asset in the runner, prints size + sha256
          # and LISTS its archive members (tar.bz2 / zip / jar) into a
          # small probe_<sha8>.json. The asset itself is never committed
          # (300 MB). Exists because the Forge release shape changed and
          # the fix must be pinned against the real bundle layout.
          if grep -q '^probe: *https://' tests/fixtures/_captures/request.txt; then
            python3 - <<'PYPROBE'
          import hashlib, json, tarfile, time, urllib.request, zipfile
          from pathlib import Path
          UA = "commander-builder/0.2 (+https://github.com/LlamaAdam/commander-builder)"
          urls = [l.split(":", 1)[1].strip() for l in open("tests/fixtures/_captures/request.txt") if l.startswith("probe:")]
          for url in urls:
              tag = hashlib.sha256(url.encode()).hexdigest()[:8]
              dest = Path("/tmp") / f"probe_{tag}.bin"
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              t0 = time.time(); h = hashlib.sha256(); n = 0
              with urllib.request.urlopen(req, timeout=600) as resp, open(dest, "wb") as fh:
                  final = resp.geturl(); ctype = resp.headers.get("Content-Type")
                  for chunk in iter(lambda: resp.read(1 << 20), b""):
                      fh.write(chunk); h.update(chunk); n += len(chunk)
              print(f"{url}: {n/1e6:.1f} MB in {time.time()-t0:.0f}s sha256={h.hexdigest()}")
              members = []; kind = "unknown"
              try:
                  if tarfile.is_tarfile(dest):
                      kind = "tar"
                      with tarfile.open(dest) as tf:
                          for m in tf:
                              members.append({"name": m.name, "size": m.size, "type": "dir" if m.isdir() else "file"})
                  elif zipfile.is_zipfile(dest):
                      kind = "zip"
                      with zipfile.ZipFile(dest) as zf:
                          for i in zf.infolist():
                              members.append({"name": i.filename, "size": i.file_size, "type": "dir" if i.is_dir() else "file"})
              except Exception as e:
                  print(f"listing failed: {type(e).__name__}: {e}")
              top = sorted({m["name"].split("/")[0] for m in members})
              jars = [m for m in members if m["name"].endswith(".jar")]
              print(f"kind={kind} members={len(members)} top-level={top[:30]}")
              print("jars:", [(j["name"], j["size"]) for j in jars[:40]])
              depth2 = sorted({"/".join(m["name"].split("/")[:2]) for m in members})
              out = {"_provenance": {"url": url, "final_url": final, "content_type": ctype, "bytes": n,
                                     "sha256": h.hexdigest(), "captured": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())},
                     "kind": kind, "member_count": len(members), "top_level": top, "depth2": depth2[:400],
                     "jars": jars, "largest": sorted(members, key=lambda m: -m["size"])[:40]}
              Path("tests/fixtures/_captures", f"probe_{tag}.json").write_text(json.dumps(out, indent=1), encoding="utf-8")
              dest.unlink()
          PYPROBE
            if ! grep -qE '^(oracle-names|combos|url):' tests/fixtures/_captures/request.txt; then exit 0; fi
          fi
          if grep -qE '^(oracle-names|combos):' tests/fixtures/_captures/request.txt; then
            pip install -q -e . 2>&1 | tail -1
            python3 - <<'PYEXTRA'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          UA = "commander-builder/0.2 (+https://github.com/LlamaAdam/commander-builder)"
          cap = Path("tests/fixtures/_captures")
          names_path = ""; top_n = 0
          for line in open(cap / "request.txt"):
              if line.startswith("oracle-names:"):
                  names_path = line.split(":", 1)[1].strip()
              elif line.startswith("combos:"):
                  raw = line.split(":", 1)[1].strip()
                  if not raw.isdigit() or not 1 <= int(raw) <= 5000:
                      raise SystemExit(f"combos: must be an integer 1..5000, got {raw!r}")
                  top_n = int(raw)
          def fetch(url, accept="application/json"):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": accept})
              with urllib.request.urlopen(req, timeout=300) as resp:
                  return resp.read()
          if names_path:
              wanted = {l.strip() for l in open(names_path, encoding="utf-8") if l.strip()}
              # Scryfall drift, pinned by the lane's own first two runs
              # (2026-09-26): /bulk-data/oracle-cards no longer carries
              # `download_uri` at all -- only `jsonl_download_uri`, a
              # gzipped JSONL (~24 MB compressed). Stream-decode it.
              import gzip, io
              meta = json.loads(fetch("https://api.scryfall.com/bulk-data/oracle-cards"))
              uri = meta.get("jsonl_download_uri") or meta.get("download_uri")
              if not uri:
                  raise SystemExit(f"no download uri in bulk-data reply: {json.dumps(meta)[:600]}")
              t0 = time.time(); blob = fetch(uri, accept="*/*")
              print(f"bulk oracle_cards: {len(blob)/1e6:.1f} MB in {time.time()-t0:.0f}s from {uri}")
              if uri.endswith(".gz") or blob[:2] == b"\x1f\x8b":
                  blob = gzip.decompress(blob)
              text = blob.decode("utf-8")
              if uri.split("?")[0].endswith((".jsonl", ".jsonl.gz")) or not text.lstrip().startswith("["):
                  cards = [json.loads(l) for l in text.splitlines() if l.strip()]
              else:
                  cards = json.loads(text)
              print(f"parsed {len(cards)} oracle cards")
              def front(n): return n.split(" // ", 1)[0]
              keep = {}
              for c in cards:
                  if c.get("layout") in ("token", "double_faced_token", "emblem", "art_series"):
                      continue
                  n = c.get("name", "")
                  hit = n if n in wanted else (front(n) if front(n) in wanted else None)
                  if hit is None or hit in keep:
                      continue
                  faces = c.get("card_faces") or []
                  keep[hit] = {
                      "name": n,
                      "type_line": c.get("type_line") or " // ".join(f.get("type_line", "") for f in faces),
                      "oracle_text": c.get("oracle_text") if c.get("oracle_text") is not None else "\n//\n".join(f.get("oracle_text", "") for f in faces),
                      "mana_cost": c.get("mana_cost") if c.get("mana_cost") is not None else " // ".join(f.get("mana_cost", "") for f in faces),
                      "cmc": c.get("cmc"), "color_identity": c.get("color_identity"),
                      "keywords": c.get("keywords"), "layout": c.get("layout"),
                      "power": c.get("power") or (faces[0].get("power") if faces else None),
                      "toughness": c.get("toughness") or (faces[0].get("toughness") if faces else None),
                      "produced_mana": c.get("produced_mana"),
                      "legal_commander": (c.get("legalities") or {}).get("commander"),
                      "game_changer": c.get("game_changer"),
                  }
              missing = sorted(wanted - set(keep))
              tag = hashlib.sha256("\n".join(sorted(wanted)).encode()).hexdigest()[:8]
              out = {"_provenance": {"source": "scryfall bulk oracle_cards", "download_uri": uri,
                                     "updated_at": meta.get("updated_at"), "names_file": names_path,
                                     "requested": len(wanted), "found": len(keep), "missing": missing},
                     "cards": dict(sorted(keep.items()))}
              (cap / f"oracle_{tag}.json").write_text(json.dumps(out, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              print(f"oracle_{tag}.json: {len(keep)}/{len(wanted)} names found; missing {len(missing)}: {missing[:20]}")
          if top_n:
              from commander_builder.combo_detection import refresh_combos
              n = refresh_combos(top_n=top_n, out_path=cap / f"combos_top{top_n}.json")
              print(f"combos_top{top_n}.json: {n} combos written")
          PYEXTRA
            if ! grep -q '^url: *https://' tests/fixtures/_captures/request.txt; then exit 0; fi
          fi
          if grep -q '^url: *https://' tests/fixtures/_captures/request.txt; then
            python3 - <<'PYURL'
          import hashlib, json, urllib.error, urllib.request
          url = ""
          for line in open("tests/fixtures/_captures/request.txt"):
              if line.startswith("url:"):
                  url = line.split(":", 1)[1].strip(); break
          uas = [
              "commander-builder/0.2",
              "commander-builder/0.1 (+https://github.com/LlamaAdam/commander-builder)",
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
          ]
          last = None
          for ua in uas:
              req = urllib.request.Request(url, headers={"User-Agent": ua, "Accept": "text/html,*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      body = resp.read()
                      meta = {"url": url, "final_url": resp.geturl(), "status": resp.status,
                              "content_type": resp.headers.get("Content-Type"),
                              "user_agent": ua, "bytes": len(body)}
                  break
              except urllib.error.HTTPError as e:
                  print(f"UA {ua!r}: HTTP {e.code}"); last = e
              except Exception as e:
                  print(f"UA {ua!r}: {type(e).__name__}: {e}"); last = e
          else:
              raise SystemExit(f"every UA failed: {last}")
          tag = hashlib.sha256(url.encode()).hexdigest()[:8]
          open(f"tests/fixtures/_captures/page_{tag}.html", "wb").write(body)
          json.dump(meta, open(f"tests/fixtures/_captures/page_{tag}.json", "w"), indent=1)
          text = body.decode("utf-8", errors="replace")
          print(json.dumps(meta))
          print("contains 'Game Changers':", "Game Changers" in text,
                "| <li> count:", text.lower().count("<li"),
                "| looks client-rendered:", ("__NEXT_DATA__" in text) or ("window.__" in text))
          PYURL
            exit 0
          fi
          if grep -q '^mode: *primer-batch' tests/fixtures/_captures/request.txt; then
            python3 - <<'PYBATCH'
          import hashlib, json, time, urllib.error, urllib.parse, urllib.request

          # Project UA: a bot-ish UA from a datacenter IP gets a
          # Cloudflare 403 (learned 2026-08-20); this string is the
          # UA both in-repo clients ship and live probes succeed with.
          UA = "commander-builder/0.1 (+https://github.com/LlamaAdam/commander-builder)"
          KEEP_PER_SITE = 25
          CAP_PER_COMMANDER = 2
          MIN_PRIMER_CHARS = 200
          PAGE_SIZE = 50
          MAX_PAGES = 12

          for line in open("tests/fixtures/_captures/request.txt"):
              if line.startswith("per-site:"):
                  # R3 F-17 (2026-09-03): a non-integer used to crash the
                  # run red and a negative silently kept nothing; bound it
                  # and say why, in the same loud-failure idiom as the
                  # deck-id path.
                  raw = line.split(":", 1)[1].strip()
                  if not raw.isdigit() or not 1 <= int(raw) <= 100:
                      raise SystemExit(
                          f"per-site: must be an integer 1..100, got {raw!r}")
                  KEEP_PER_SITE = int(raw)

          def get_json(url, retry_429=True):
              req = urllib.request.Request(url, headers={
                  "Accept": "application/json", "User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  if e.code == 429 and retry_429:
                      time.sleep(5)
                      return get_json(url, retry_429=False)
                  raise

          def delta_text(desc):
              # Archidekt descriptions are Quill Delta JSON strings.
              # Card mentions are {"insert": {"card-link": name}} embeds
              # (batch-1 finding) -- they render as the card name, and a
              # renderer that drops them loses every card the primer
              # names. Image embeds render as nothing. Non-Delta text
              # passes through verbatim.
              try:
                  ops = json.loads(desc).get("ops") or []
              except Exception:
                  return desc or ""
              out = []
              for op in ops:
                  ins = op.get("insert")
                  if isinstance(ins, str):
                      out.append(ins)
                  elif isinstance(ins, dict) and isinstance(ins.get("card-link"), str):
                      out.append(ins["card-link"])
              return "".join(out)

          seen_fp = {}          # fingerprint -> "site:id" first holder
          cmdr_counts = {}      # commander tuple -> kept count
          stats = {s: {"kept": 0, "dup": 0, "cap": 0, "thin": 0,
                       "nocmdr": 0, "err": 0}
                   for s in ("archidekt", "moxfield")}

          def consider(site, label, commanders, card_names, text_len, save):
              s = stats[site]
              if not commanders:
                  s["nocmdr"] += 1
                  return
              if text_len < MIN_PRIMER_CHARS:
                  s["thin"] += 1
                  return
              fp = hashlib.sha256(
                  "\n".join(sorted(card_names)).encode()).hexdigest()
              if fp in seen_fp:
                  s["dup"] += 1
                  print(f"  dup-list skip: {label} == {seen_fp[fp]}")
                  return
              ckey = tuple(sorted(c.lower() for c in commanders))
              if cmdr_counts.get(ckey, 0) >= CAP_PER_COMMANDER:
                  s["cap"] += 1
                  print(f"  commander-cap skip ({'/'.join(commanders)}): {label}")
                  return
              seen_fp[fp] = label
              cmdr_counts[ckey] = cmdr_counts.get(ckey, 0) + 1
              save()
              s["kept"] += 1
              print(f"kept {label} ({'/'.join(commanders)}, primer {text_len} chars)")

          def dump(path, obj):
              with open(path, "w") as f:
                  json.dump(obj, f, indent=1)

          # ---------------- Archidekt (views: no like count in its API) --
          print(f"== Archidekt: top-viewed walk, keep {KEEP_PER_SITE} ==")
          page, rank = 1, 0
          while stats["archidekt"]["kept"] < KEEP_PER_SITE and page <= MAX_PAGES:
              url = ("https://archidekt.com/api/decks/v3/?orderBy=-viewCount"
                     f"&pageSize={PAGE_SIZE}&page={page}")
              try:
                  hits = get_json(url).get("results") or []
              except Exception as e:
                  print(f"archidekt search page {page} failed: {e}")
                  break
              if not hits:
                  break
              for h in hits:
                  if stats["archidekt"]["kept"] >= KEEP_PER_SITE:
                      break
                  if h.get("private"):
                      continue
                  rank += 1
                  did = h.get("id")
                  try:
                      deck = get_json(f"https://archidekt.com/api/decks/{did}/")
                  except Exception as e:
                      stats["archidekt"]["err"] += 1
                      print(f"  fetch failed for archidekt {did}: {e}")
                      time.sleep(0.4)
                      continue
                  cards = deck.get("cards") or []
                  def _oc(c):
                      return (c.get("card") or {}).get("oracleCard") or {}
                  names = [_oc(c).get("name") for c in cards if _oc(c).get("name")]
                  commanders = [_oc(c).get("name") for c in cards
                                if "Commander" in (c.get("categories") or [])
                                and _oc(c).get("name")]
                  text = delta_text(deck.get("description") or "")

                  def save(deck=deck, did=did, rank=rank, cards=cards):
                      dump(f"tests/fixtures/_captures/primer_corpus_arch_{did}.json", {
                          "_provenance": {
                              "site": "archidekt",
                              "source": f"https://archidekt.com/api/decks/{did}/",
                              "rank": rank,
                              "ordering": "-viewCount (the API exposes no like count)",
                              "note": ("trimmed in-runner for the FP-018.4 "
                                       "primer corpus; description is the "
                                       "verbatim API string"),
                          },
                          "id": deck.get("id"),
                          "name": deck.get("name"),
                          "viewCount": deck.get("viewCount"),
                          "description": deck.get("description"),
                          "cards": [
                              {"quantity": c.get("quantity"),
                               "categories": c.get("categories"),
                               "name": _oc(c).get("name"),
                               "layout": _oc(c).get("layout")}
                              for c in cards
                          ],
                      })
                  consider("archidekt", f"archidekt:{did}", commanders,
                           names, len(text), save)
                  time.sleep(0.4)
              page += 1
              time.sleep(1)

          # ---------------- Moxfield (likes: real like ordering) ---------
          # Endpoint + params mirror moxfield_import.py (the in-repo
          # client): api2 search with fmt=commander, sortColumn/sortType
          # likes, then v3/decks/all/<publicId> for the full deck. Be
          # polite: 1s between deck fetches (FETCH_SLEEP_SEC precedent).
          print(f"== Moxfield: top-liked walk, keep {KEEP_PER_SITE} ==")
          page, rank = 1, 0
          while stats["moxfield"]["kept"] < KEEP_PER_SITE and page <= MAX_PAGES:
              params = {
                  "pageNumber": str(page), "pageSize": str(PAGE_SIZE),
                  "sortColumn": "likes", "sortType": "likes",
                  "sortDirection": "descending", "fmt": "commander",
              }
              url = ("https://api2.moxfield.com/v2/decks/search?"
                     + urllib.parse.urlencode(params))
              try:
                  entries = get_json(url).get("data") or []
              except Exception as e:
                  print(f"moxfield search page {page} failed: {e}")
                  break
              if not entries:
                  break
              for e in entries:
                  if stats["moxfield"]["kept"] >= KEEP_PER_SITE:
                      break
                  rank += 1
                  pid = e.get("publicId") or e.get("id")
                  if not pid:
                      continue
                  try:
                      deck = get_json(f"https://api2.moxfield.com/v3/decks/all/{pid}")
                  except Exception as exc:
                      stats["moxfield"]["err"] += 1
                      print(f"  fetch failed for moxfield {pid}: {exc}")
                      time.sleep(1)
                      continue
                  boards = deck.get("boards") or {}
                  def _bnames(bname, boards=boards):
                      vals = (boards.get(bname) or {}).get("cards", {}) or {}
                      out = []
                      for v in vals.values():
                          nm = (v.get("card") or {}).get("name") or v.get("name")
                          if nm:
                              out.append(nm)
                      return out
                  commanders = _bnames("commanders")
                  names = _bnames("mainboard")
                  desc = deck.get("description") or ""
                  like_count = e.get("likeCount")
                  if like_count is None:
                      like_count = deck.get("likeCount")

                  def save(deck=deck, e=e, pid=pid, rank=rank,
                           commanders=commanders, names=names,
                           desc=desc, like_count=like_count):
                      dump(f"tests/fixtures/_captures/primer_corpus_mox_{pid}.json", {
                          "_provenance": {
                              "site": "moxfield",
                              "source": f"https://api2.moxfield.com/v3/decks/all/{pid}",
                              "rank": rank,
                              "ordering": "likes descending",
                              "note": ("trimmed in-runner for the FP-018.4 "
                                       "primer corpus; description is the "
                                       "verbatim API string (markdown, NOT "
                                       "Quill Delta -- site shapes differ)"),
                          },
                          "publicId": pid,
                          "name": deck.get("name"),
                          "likeCount": like_count,
                          "description": desc,
                          "commanders": commanders,
                          "mainboard": names,
                      })
                  consider("moxfield", f"moxfield:{pid}", commanders,
                           names, len(desc), save)
                  time.sleep(1)
              page += 1
              time.sleep(1)

          print("== summary ==")
          for site, s in stats.items():
              print(f"{site}: kept={s['kept']}/{KEEP_PER_SITE} "
                    f"dup={s['dup']} commander-cap={s['cap']} "
                    f"thin-primer={s['thin']} no-commander={s['nocmdr']} "
                    f"fetch-err={s['err']}")
          if all(s["kept"] == 0 for s in stats.values()):
              raise SystemExit("zero captures on both sites -- failing loudly")
          PYBATCH
            exit 0
          fi
          UA="commander-builder/0.1 (+https://github.com/LlamaAdam/commander-builder)"
          if grep -q '^commander:' tests/fixtures/_captures/request.txt; then
            # Try EVERY commander: line until one search hits — MDFC
            # commanders may be indexed under the full 'Front // Back'
            # name (the plain front-face search for Esika returned zero
            # results on 2026-08-27), and guessing the index form wrong
            # must not fail the whole capture.
            DECK_ID=""
            while IFS= read -r CNAME; do
              [ -z "$CNAME" ] && continue
              echo "searching decks for commander: $CNAME"
              DECK_ID="$(python3 - "$CNAME" <<'PYSEARCH'
          import json, sys, urllib.parse, urllib.request
          name = sys.argv[1]
          url = ("https://archidekt.com/api/decks/v3/?commanderName="
                 + urllib.parse.quote(name) + "&orderBy=-viewCount&pageSize=10")
          req = urllib.request.Request(url, headers={
              "Accept": "application/json",
              "User-Agent": "commander-builder/0.1 (+https://github.com/LlamaAdam/commander-builder)",
          })
          data = json.load(urllib.request.urlopen(req, timeout=60))
          hits = data.get("results") or []
          for h in hits:
              if not h.get("private"):
                  print(h["id"]); break
          PYSEARCH
          )"
              if [ -n "$DECK_ID" ]; then echo "hit: deck $DECK_ID for '$CNAME'"; break; fi
              echo "  no public deck for '$CNAME' — trying next"
            done < <(grep '^commander:' tests/fixtures/_captures/request.txt | cut -d: -f2- | sed 's/^ *//')
            if [ -z "$DECK_ID" ]; then echo "no public deck found for ANY requested commander"; exit 1; fi
          else
            DECK_ID="$(grep -oE '[0-9]+' tests/fixtures/_captures/request.txt | head -1)"
          fi
          if [ -z "$DECK_ID" ]; then echo "request.txt must contain a numeric deck id or commander:<name>"; exit 1; fi
          echo "deck id: $DECK_ID"
          # First attempt (2026-08-20) 403'd: Cloudflare rejects a
          # bot-ish UA from a datacenter IP. Use the PROJECT UA string
          # (archidekt_client.USER_AGENT, which the live probe of
          # 2026-07-25 succeeded with), and fall back to a browser UA.
          fetch() {
            curl -sS --fail --max-time 60 \
              -H "Accept: application/json" \
              -H "User-Agent: $1" \
              "https://archidekt.com/api/decks/$DECK_ID/" \
              -o "tests/fixtures/_captures/archidekt_deck_$DECK_ID.json"
          }
          fetch "commander-builder/0.1 (+https://github.com/LlamaAdam/commander-builder)" \
            || fetch "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          python3 - <<'PY'
          import json, collections, glob
          hits = glob.glob("tests/fixtures/_captures/archidekt_deck_*.json")
          if not hits:
              raise SystemExit(0)
          path = hits[0]
          data = json.load(open(path))
          print("top-level keys:", sorted(data.keys()))
          cards = data.get("cards", [])
          layouts = collections.Counter(
              (c.get("card", {}).get("oracleCard", {}) or {}).get("layout")
              for c in cards
          )
          print("card count:", len(cards), "layouts:", dict(layouts))
          PY
      - name: Commit capture to the calling branch
        run: |
          # Porcelain check rather than a filename glob: single mode
          # writes archidekt_deck_<id>.json, batch mode writes
          # primer_corpus_<id>.json; request.txt itself is already
          # committed (it was the trigger), so anything dirty under
          # _captures/ is a fresh capture.
          if ! git status --porcelain tests/fixtures/_captures/ | grep -q .; then
            echo "nothing captured -- skipping commit"; exit 0
          fi
          git config user.name "archidekt-capture[bot]"
          git config user.email "noreply@users.noreply.github.com"
          git add tests/fixtures/_captures/
          git commit -m "chore: capture Archidekt API response(s) (raw material; delete after consuming) [skip ci]"
          git push
